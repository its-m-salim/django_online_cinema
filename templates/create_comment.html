{% extends 'base.html' %}
{% block title %}Новый комментарий{% endblock %}
{% block content %}
<div class="form-box">
    <h1>Новый комментарий</h1>
    <div class="form-sub">К фильму: {{ movie.title }}</div>
    
    <form method="post">
        {% csrf_token %}
        <label>Ваше имя</label>
        <input type="text" name="author_name" required>

        <label>Комментарий</label>
        <textarea name="text" rows="6" required></textarea>

        <div class="form-actions">
            <button class="btn btn-red" type="submit">Сохранить</button>
            <a class="btn btn-line" href="{% url 'movie_detail' movie.id %}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
